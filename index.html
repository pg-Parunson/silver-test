<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>주얼리 제품 관리 · 모의시험</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <!-- 홈 화면 -->
  <section id="screen-home" class="screen">
    <header class="home-header">
      <p class="eyebrow">NCS 과정평가 대비</p>
      <h1>주얼리 제품 관리<br>모의시험</h1>
      <p class="sub">객관식 16 · 주관식 4 — 총 20문항 / 60분 / 100점 만점</p>
    </header>
    <button id="btn-start" class="btn-primary big">새 시험 시작</button>
    <p class="hint">시작하면 60분 타이머가 바로 작동합니다. 매번 문제은행에서 새로 출제됩니다.</p>
    <section id="history-section" class="history hidden">
      <h2>지난 기록</h2>
      <ul id="history-list"></ul>
    </section>
  </section>

  <!-- 시험 화면 -->
  <section id="screen-exam" class="screen hidden">
    <div class="exam-topbar">
      <div id="timer" class="timer">60:00</div>
      <div id="progress" class="progress">1 / 20</div>
      <button id="btn-submit-top" class="btn-ghost">제출</button>
    </div>
    <nav id="qnav" class="qnav"></nav>
    <div id="question-area"></div>
    <div class="exam-bottombar">
      <button id="btn-prev" class="btn-secondary">이전</button>
      <button id="btn-next" class="btn-primary">다음</button>
    </div>
  </section>

  <!-- 결과 화면 -->
  <section id="screen-result" class="screen hidden">
    <header class="result-header">
      <p class="eyebrow" id="result-date"></p>
      <div id="result-score" class="score"></div>
      <p id="result-summary" class="sub"></p>
    </header>
    <div id="result-list"></div>
    <div class="result-actions">
      <button id="btn-retry" class="btn-primary big">새 시험 시작</button>
      <button id="btn-home" class="btn-secondary big">처음으로</button>
    </div>
  </section>
</div>
<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
